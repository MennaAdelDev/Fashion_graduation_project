<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StyleWeave – Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="wrap">
  <header class="auth-top">
    <a class="logo" href="index.html" aria-label="StyleWeave home"><svg class="i" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 6.8 4.5 4.5 0 0 1 20 9.5c0 6.1-8 11-8 11z"/><path d="M9.2 10.2l2.8 2.6 3.2-3.8" opacity=".85"/></svg>StyleWeave</a>
    <div class="alt"><span>New to StyleWeave?</span><a class="btn ghost" href="register.html">Sign Up</a></div>
  </header>

  <main class="auth">
    <section class="auth-card" aria-labelledby="t">
      <div class="eyebrow">Welcome back<i>•</i>Your craft</div>
      <h1 class="auth-title" id="t">Log in to your <em>studio</em></h1>
      <p class="auth-sub">Pick up your designs, previews and orders right where you left them.</p>

      <form id="authForm" data-mode="login" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input"><input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div>
          <span class="err" role="alert"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input has-toggle"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password">
            <button class="pw-toggle" type="button" data-target="password" aria-label="Show password"></button></div>
          <span class="err" role="alert"></span>
        </div>
        <div class="line">
          <label class="check"><input type="checkbox" name="remember" id="remember"> Remember me</label>
          <a class="link" href="#forgot">Forgot password?</a>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <button class="btn solid submit" type="submit">Log In <svg class="i" viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6"/></svg></button>
      </form>
      <p class="switch">Don't have an account? <a class="link" href="register.html">Sign Up</a></p>
    </section>

    <aside class="auth-art" aria-hidden="true">
      <img src="img/hero.jpg" alt="">
    </aside>
  </main>
</div>
<script src="auth.js"></script>
</body>
</html>
