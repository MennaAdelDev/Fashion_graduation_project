openapi: 3.0.3
info:
  title: Fashion AI Marketplace API
  version: 1.1.0-draft
  description: 'Sprint 1 API contract (draft for team approval). All paths are relative to the server URL. Success responses use { data } (lists add { meta }). Errors use { error: { code, message, details } }. JSON fields are snake_case and match the database. x-roles lists the roles allowed on an operation and x-implementation-sprint says when the real implementation is planned. Operations tagged "Order workflow (deferred)" are designed now but built only if the Month-3 MVP is stable.'
servers:
  - url: http://localhost:5000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Categories
  - name: Materials
  - name: Providers
  - name: Provider profile
  - name: Reviews
  - name: Projects
  - name: Designs
  - name: Matching
  - name: Requests
  - name: Messaging
  - name: Notifications
  - name: AI (draft)
  - name: Order workflow (deferred)
paths:
  /health:
    get:
      tags:
        - System
      summary: Liveness check
      x-implementation-sprint: 1
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      time:
                        type: string
                        format: date-time
                required:
                  - data
  /health/db:
    get:
      tags:
        - System
      summary: Database connectivity check
      description: Reads the categories count through the service role. Used to verify the Supabase configuration.
      x-implementation-sprint: 1
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      database:
                        type: string
                      categories_count:
                        type: integer
                required:
                  - data
  /auth/register:
    post:
      tags:
        - Auth
      summary: Create a customer or provider account
      description: role must be customer or provider (admin is never accepted). provider_type is required for providers. Providers get a placeholder providers row (business_name = name) to complete during onboarding.
      x-implementation-sprint: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthResult"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in with email and password
      x-implementation-sprint: 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthResult"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Current user
      x-implementation-sprint: 2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      tags:
        - Categories
      summary: List active categories
      x-implementation-sprint: 2
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                required:
                  - data
  /materials:
    get:
      tags:
        - Materials
      summary: List the material (fabric) catalog
      description: Controlled vocabulary shared by the AI, the matching engine and provider profiles, so that fabric names are never free text.
      x-implementation-sprint: 2
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Material"
                required:
                  - data
  /providers:
    get:
      tags:
        - Providers
      summary: Search and filter providers
      description: Public marketplace browsing without AI. quantity and max_price are evaluated per category, so category_id is required when either is used. quantity keeps providers where min_quantity <= quantity <= max_quantity for that category. max_price keeps providers whose min_price <= max_price for that category. material_id keeps providers that work with that material. min_rating uses the computed rating average. Default sort is -rating.
      x-implementation-sprint: 2
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Text search in business name and description.
          schema:
            type: string
        - name: category_id
          in: query
          required: false
          description: Only providers that support this category.
          schema:
            type: string
            format: uuid
        - name: material_id
          in: query
          required: false
          description: Only providers that work with this material.
          schema:
            type: string
            format: uuid
        - name: provider_type
          in: query
          required: false
          description: Provider type.
          schema:
            $ref: "#/components/schemas/ProviderType"
        - name: city
          in: query
          required: false
          description: City.
          schema:
            type: string
        - name: quantity
          in: query
          required: false
          description: Requires category_id.
          schema:
            type: integer
            minimum: 1
        - name: max_price
          in: query
          required: false
          description: Requires category_id.
          schema:
            type: number
            minimum: 0
        - name: min_rating
          in: query
          required: false
          description: Minimum rating average.
          schema:
            type: number
            minimum: 1
            maximum: 5
        - name: sort
          in: query
          required: false
          description: Sort field; a leading minus means descending.
          schema:
            type: string
            enum:
              - rating
              - -rating
              - price
              - -price
              - name
              - -name
            default: -rating
        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderSummary"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
                required:
                  - data
                  - meta
        "400":
          $ref: "#/components/responses/BadRequest"
  /providers/compare:
    get:
      tags:
        - Providers
      summary: Compare providers side by side
      description: Returns full profiles for 2 or 3 providers. When project_id is given, each item includes the stored match score and reason for that project when one exists.
      x-roles:
        - customer
      x-implementation-sprint: 4
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated provider ids (2 or 3).
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          description: Optional project for match scores.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderComparisonItem"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /providers/me:
    get:
      tags:
        - Provider profile
      summary: Own provider profile
      x-roles:
        - provider
      x-implementation-sprint: 2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProviderProfile"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags:
        - Provider profile
      summary: Update own provider profile
      x-roles:
        - provider
      x-implementation-sprint: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProviderProfile"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /providers/me/pricing/{category_id}:
    put:
      tags:
        - Provider profile
      summary: Create or replace pricing, MOQ and capacity for a category
      description: Also adds the category to the provider specialties.
      x-roles:
        - provider
      x-implementation-sprint: 2
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingUpsert"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProviderPricing"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Provider profile
      summary: Remove a category and its pricing
      x-roles:
        - provider
      x-implementation-sprint: 2
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /providers/me/materials:
    put:
      tags:
        - Provider profile
      summary: Replace the materials the provider works with
      x-roles:
        - provider
      x-implementation-sprint: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderMaterialsReplace"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Material"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /providers/me/working-hours:
    put:
      tags:
        - Provider profile
      summary: Replace working hours
      x-roles:
        - provider
      x-implementation-sprint: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkingHoursReplace"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkingHour"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /providers/me/availability:
    put:
      tags:
        - Provider profile
      summary: Upsert availability dates
      x-roles:
        - provider
      x-implementation-sprint: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityReplace"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AvailabilityEntry"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /providers/me/portfolio:
    post:
      tags:
        - Provider profile
      summary: Upload a portfolio image
      description: "Stored in the portfolio bucket. Allowed types: jpeg, png, webp. Max 5 MB."
      x-roles:
        - provider
      x-implementation-sprint: 2
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                category_id:
                  type: string
                  format: uuid
                description:
                  type: string
              required:
                - image
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PortfolioItem"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /providers/me/portfolio/{portfolio_id}:
    delete:
      tags:
        - Provider profile
      summary: Delete a portfolio item
      x-roles:
        - provider
      x-implementation-sprint: 2
      parameters:
        - name: portfolio_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Success
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /providers/{id}:
    get:
      tags:
        - Providers
      summary: Provider profile
      description: Profile with pricing, materials, working hours and portfolio.
      x-implementation-sprint: 2
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProviderProfile"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /providers/{id}/availability:
    get:
      tags:
        - Providers
      summary: Provider availability
      x-implementation-sprint: 2
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Start date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End date (YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AvailabilityEntry"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /providers/{id}/reviews:
    get:
      tags:
        - Reviews
      summary: Provider reviews
      description: Hidden reviews are excluded.
      x-implementation-sprint: 3
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
                required:
                  - data
                  - meta
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Reviews
      summary: Review a provider
      description: One review per customer per provider (409 if it already exists). Allowed only for a customer who has an accepted request with this provider (backend rule).
      x-roles:
        - customer
      x-implementation-sprint: 3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreate"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Review"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects:
    get:
      tags:
        - Projects
      summary: List projects
      description: Customers see their own projects. Providers see projects they received a request for. Admins see all.
      x-roles:
        - customer
        - provider
        - admin
      x-implementation-sprint: 3
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by status.
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
                required:
                  - data
                  - meta
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Projects
      summary: Create a project as draft
      description: Only title is required while the project is a draft. A project can contain several items (for example a dress, trousers and shoes); each item has its own category, quantity and requirements. A single-product request is simply a project with one item.
      x-roles:
        - customer
      x-implementation-sprint: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{id}:
    get:
      tags:
        - Projects
      summary: Project details
      x-roles:
        - customer
        - provider
        - admin
      x-implementation-sprint: 3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Projects
      summary: Update project fields
      description: Allowed for the owner while the status is draft or open. Items are changed through PUT /projects/{id}/items.
      x-roles:
        - customer
      x-implementation-sprint: 3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}/items:
    put:
      tags:
        - Projects
      summary: Replace the items of a project
      description: Replaces the whole list. Allowed while the project is draft, or open with no active requests. The AI extraction result is saved with this endpoint after the customer confirms it.
      x-roles:
        - customer
      x-implementation-sprint: 3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectItemsReplace"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectItem"
                required:
                  - data
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /projects/{id}/status:
    patch:
      tags:
        - Projects
      summary: Change project status
      description: "Allowed transitions: draft to open (owner; needs at least one item, enforced by a database trigger), open to in_progress (when a request is accepted), in_progress to completed (owner or the accepted provider), draft/open/in_progress to cancelled (owner). draft cannot be set."
      x-roles:
        - customer
        - provider
      x-implementation-sprint: 3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
