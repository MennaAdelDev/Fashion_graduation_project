components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: "VALIDATION_ERROR: body, query or path parameters are invalid."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "UNAUTHORIZED: missing or invalid token."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "FORBIDDEN: role or ownership not allowed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "NOT_FOUND: resource does not exist."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "CONFLICT: duplicate or invalid state transition."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
                - NOT_IMPLEMENTED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                required:
                  - field
                  - message
          required:
            - code
            - message
      required:
        - error
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
        - page
        - page_size
        - total
    Role:
      type: string
      enum:
        - customer
        - provider
        - admin
    ProviderType:
      type: string
      enum:
        - designer
        - manufacturer
      description: UI label for manufacturer is Factory.
    ProjectStatus:
      type: string
      enum:
        - draft
        - open
        - in_progress
        - completed
        - cancelled
      description: Coarse project lifecycle. A project needs at least one item before leaving draft. Fine-grained production states live on orders (deferred).
    RequestStatus:
      type: string
      enum:
        - pending
        - negotiating
        - accepted
        - rejected
        - withdrawn
        - expired
      description: "pending: sent to the provider. accepted or rejected: provider decision (MVP). negotiating: a structured counter-offer is in progress (deferred). withdrawn: cancelled by the customer. expired: closed because another provider was accepted or no answer in time. Only one request per project can be accepted."
    AvailabilityStatus:
      type: string
      enum:
        - available
        - limited
        - unavailable
    DesignSource:
      type: string
      enum:
        - upload
        - generated
        - demo
      description: demo marks a seeded fallback image so it is never presented as a real generation.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        provider_id:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - name
        - email
        - role
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        role:
          type: string
          enum:
            - customer
            - provider
        provider_type:
          $ref: "#/components/schemas/ProviderType"
        terms:
          type: boolean
          enum:
            - true
      required:
        - name
        - email
        - password
        - role
        - terms
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    AuthResult:
      type: object
      properties:
        token:
          type: string
          description: "Supabase access token. Send as Authorization: Bearer <token>."
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Seconds.
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
    Material:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
    ProviderMaterialsReplace:
      type: object
      properties:
        material_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
        - material_ids
    ProviderPricing:
      type: object
      properties:
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        min_quantity:
          type: integer
          description: MOQ.
        max_quantity:
          type: integer
          description: Maximum capacity.
        min_price:
          type: number
        max_price:
          type: number
        price_unit:
          type: string
          enum:
            - per_piece
            - per_order
        lead_time_days:
          type: integer
          nullable: true
      required:
        - category_id
        - min_quantity
        - max_quantity
        - min_price
        - max_price
        - price_unit
    PricingUpsert:
      type: object
      properties:
        min_quantity:
          type: integer
          minimum: 1
        max_quantity:
          type: integer
          minimum: 1
        min_price:
          type: number
          minimum: 0
        max_price:
          type: number
          minimum: 0
        price_unit:
          type: string
          enum:
            - per_piece
            - per_order
          default: per_piece
        lead_time_days:
          type: integer
          minimum: 0
          nullable: true
      required:
        - min_quantity
        - max_quantity
        - min_price
        - max_price
    WorkingHour:
      type: object
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday ... 6 = Saturday.
        opens_at:
          type: string
          example: 09:00
          description: HH:MM.
          nullable: true
        closes_at:
          type: string
          example: 17:00
          description: HH:MM.
          nullable: true
        is_closed:
          type: boolean
      required:
        - day_of_week
        - is_closed
    WorkingHoursReplace:
      type: object
      properties:
        working_hours:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/WorkingHour"
      required:
        - working_hours
    AvailabilityEntry:
      type: object
      properties:
        date:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/AvailabilityStatus"
        capacity:
          type: integer
